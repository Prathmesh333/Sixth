name: Sixth checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.17
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff check apps/api tests scripts
      - run: uv run pytest tests/test_application.py -q
      - run: npm run build
  graph:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.17
      - run: uv sync --frozen
      - run: uv run pytest tests/test_falkordb.py -q
        env:
          SIXTH_GRAPH_TEST: '1'
