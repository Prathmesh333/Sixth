name: Sixth checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.17
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff check apps/api tests scripts
      - run: uv run pytest tests/test_application.py -q
      - run: npm run build
  graph:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.17
      - run: uv sync --frozen
      - run: uv run pytest tests/test_falkordb.py -q
        env:
          SIXTH_GRAPH_TEST: '1'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health/ready
      - run: curl --fail http://127.0.0.1:8000/
      - if: always()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: docker compose down
